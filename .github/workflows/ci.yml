# CI for the MOOVE design system (no deployment).
#   pull request / push to main -> verify: tokens, tests, types, lint, Storybook tests, builds
# The ruleset (.github/rulesets/protect-main.json) requires the `verify` check before a PR can merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the check that is still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  STORYBOOK_DISABLE_TELEMETRY: "1"

jobs:
  verify:
    # The ruleset (.github/rulesets/protect-main.json) requires this exact check name before merging.
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generated tokens are up to date
        run: |
          bun run tokens
          if [ -n "$(git status --porcelain -- src/styles src/tokens tokens/build)" ]; then
            echo "::error::Generated token files differ from tokens/*.json. Run 'bun run tokens' and commit the result."
            git status --porcelain -- src/styles src/tokens tokens/build
            exit 1
          fi

      - name: Library build (dist-lib) is up to date
        run: |
          bun run build:lib
          if [ -n "$(git status --porcelain -- dist-lib)" ]; then
            echo "::error::dist-lib differs from src. Run 'bun run build:lib' and commit the result."
            git status --porcelain -- dist-lib
            exit 1
          fi

      - name: Token and contrast tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Install Chromium for story tests
        run: bunx playwright install --with-deps chromium

      - name: Story tests (render, interactions, accessibility)
        run: bun run test:stories

      - name: Build Storybook
        run: bun run build-storybook

      - name: Upload Storybook for review
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

      - name: Build registry
        run: bun run registry:build
